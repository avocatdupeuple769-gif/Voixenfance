name: Build AAB Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    name: AAB signé pour Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Résoudre package.json (workspace → npm)
        working-directory: artifacts/guardian-gabon
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const catalog = {
              '@tanstack/react-query': '^5.90.21',
              'react': '19.1.0',
              'react-dom': '19.1.0',
              'zod': '^3.25.76'
            };
            function resolve(deps) {
              if (!deps) return deps;
              const out = {};
              for (const [k, v] of Object.entries(deps)) {
                if (k === '@workspace/api-client-react') continue;
                out[k] = v === 'catalog:' ? (catalog[k] || v) : v;
              }
              return out;
            }
            pkg.devDependencies = resolve(pkg.devDependencies);
            pkg.dependencies = resolve(pkg.dependencies);
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('package.json résolu');
          "

      - name: Installer les dépendances
        working-directory: artifacts/guardian-gabon
        run: npm install --legacy-peer-deps

      - name: Symlink Metro bundler
        run: ln -sf artifacts/guardian-gabon/node_modules node_modules

      - name: Variables d'environnement (Firebase + Cloudinary)
        working-directory: artifacts/guardian-gabon
        run: |
          echo "EXPO_PUBLIC_FIREBASE_DB_URL=https://lesailesdebride-f3aca-default-rtdb.firebaseio.com" > .env
          echo "EXPO_PUBLIC_CLOUDINARY_CLOUD=dwwky8tnr" >> .env
          echo "EXPO_PUBLIC_CLOUDINARY_PRESET=afhxvsxc" >> .env
          cp .env .env.production

      - name: Expo Prebuild Android
        working-directory: artifacts/guardian-gabon
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Générer keystore et configurer la signature
        working-directory: artifacts/guardian-gabon
        run: |
          # Générer le keystore directement dans android/app/ (chemin simple)
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias lesailesdebride \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Les Ailes de Bride,O=LesAilesDeBride,L=Libreville,C=GA" \
            -storepass LesAiles2024! \
            -keypass LesAiles2024!
          echo "✅ Keystore généré"
          ls -lh android/app/release.keystore

          # Ajouter les variables de signature dans gradle.properties
          cat >> android/gradle.properties << 'EOF'

          RELEASE_STORE_FILE=release.keystore
          RELEASE_KEY_ALIAS=lesailesdebride
          RELEASE_STORE_PASSWORD=LesAiles2024!
          RELEASE_KEY_PASSWORD=LesAiles2024!
          EOF
          echo "✅ gradle.properties mis à jour"

          # Patcher build.gradle — approche gradle.properties (React Native officiel)
          node -e "
            const fs = require('fs');
            let g = fs.readFileSync('android/app/build.gradle', 'utf8');

            const signingBlock = \`
        signingConfigs {
            release {
                if (project.hasProperty('RELEASE_STORE_FILE')) {
                    storeFile file(RELEASE_STORE_FILE)
                    storePassword RELEASE_STORE_PASSWORD
                    keyAlias RELEASE_KEY_ALIAS
                    keyPassword RELEASE_KEY_PASSWORD
                }
            }
        }\`;

            // Insérer signingConfigs juste avant buildTypes
            if (!g.includes('signingConfigs')) {
                g = g.replace(/(\n[ \t]+buildTypes\s*\{)/, signingBlock + '\$1');
            }

            // Ajouter signingConfig dans le bloc release de buildTypes
            if (!g.includes('signingConfig signingConfigs.release')) {
                const buildTypesPos = g.indexOf('buildTypes');
                const releasePos = g.indexOf('release {', buildTypesPos);
                if (releasePos !== -1) {
                    const insertPos = releasePos + 'release {'.length;
                    g = g.slice(0, insertPos) +
                        '\n            signingConfig signingConfigs.release' +
                        g.slice(insertPos);
                }
            }

            fs.writeFileSync('android/app/build.gradle', g);
            console.log('✅ build.gradle patché avec signingConfigs');
          "

      - name: Rendre Gradle exécutable
        working-directory: artifacts/guardian-gabon/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ hashFiles('artifacts/guardian-gabon/android/**/*.gradle*') }}
          restore-keys: gradle-aab-

      - name: Build AAB uniquement (Play Store)
        working-directory: artifacts/guardian-gabon/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Vérifier le AAB
        run: |
          echo "=== AAB généré ==="
          find artifacts/guardian-gabon/android/app/build/outputs/bundle -name "*.aab" -exec ls -lh {} \;

      - name: Upload AAB Play Store
        uses: actions/upload-artifact@v4
        with:
          name: LesAilesDeBride-PlayStore-AAB
          path: artifacts/guardian-gabon/android/app/build/outputs/bundle/release/*.aab
          retention-days: 60

      - name: Upload Keystore (GARDEZ CE FICHIER pour les mises à jour)
        uses: actions/upload-artifact@v4
        with:
          name: LesAilesDeBride-Keystore-IMPORTANT
          path: artifacts/guardian-gabon/release.keystore
          retention-days: 60
