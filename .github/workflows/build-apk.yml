name: Build AAB Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    name: AAB signé pour Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Résoudre package.json
        working-directory: artifacts/guardian-gabon
        run: |
          node -e "var fs=require('fs');var pkg=JSON.parse(fs.readFileSync('package.json','utf8'));var cat={'@tanstack/react-query':'^5.90.21','react':'19.1.0','react-dom':'19.1.0','zod':'^3.25.76'};function res(d){if(!d)return d;var o={};Object.entries(d).forEach(function(e){if(e[0]==='@workspace/api-client-react')return;o[e[0]]=e[1]==='catalog:'?(cat[e[0]]||e[1]):e[1];});return o;}pkg.devDependencies=res(pkg.devDependencies);pkg.dependencies=res(pkg.dependencies);fs.writeFileSync('package.json',JSON.stringify(pkg,null,2));console.log('OK');"

      - name: Installer les dépendances
        working-directory: artifacts/guardian-gabon
        run: npm install --legacy-peer-deps

      - name: Symlink Metro bundler
        run: ln -sf artifacts/guardian-gabon/node_modules node_modules

      - name: Variables d'environnement
        working-directory: artifacts/guardian-gabon
        run: |
          printf '%s\n' 'EXPO_PUBLIC_FIREBASE_DB_URL=https://lesailesdebride-f3aca-default-rtdb.firebaseio.com' 'EXPO_PUBLIC_CLOUDINARY_CLOUD=dwwky8tnr' 'EXPO_PUBLIC_CLOUDINARY_PRESET=afhxvsxc' > .env
          cp .env .env.production

      - name: Expo Prebuild Android
        working-directory: artifacts/guardian-gabon
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Préparer le keystore
        working-directory: artifacts/guardian-gabon
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "✅ Utilisation du keystore stocké (secret RELEASE_KEYSTORE_BASE64)"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "⚠️  Aucun secret RELEASE_KEYSTORE_BASE64 trouvé — génération d'un nouveau keystore"
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias lesailesdebride \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LesAilesDeBride,O=LesAilesDeBride,L=Libreville,C=GA" \
              -storepass LesAiles2024 -keypass LesAiles2024
            echo ""
            echo "========================================================"
            echo "IMPORTANT — COPIEZ CE BASE64 ET AJOUTEZ-LE COMME SECRET"
            echo "Secret GitHub : RELEASE_KEYSTORE_BASE64"
            echo "========================================================"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "========================================================"
          fi
          echo "--- Empreinte SHA1 du keystore utilisé ---"
          keytool -list -keystore android/app/release.keystore \
            -storepass LesAiles2024 -alias lesailesdebride 2>/dev/null | grep -i "SHA1\|SHA-1" || true
          ls -lh android/app/release.keystore

      - name: Ajouter signing dans gradle.properties
        working-directory: artifacts/guardian-gabon
        run: |
          printf '\nRELEASE_STORE_FILE=release.keystore\nRELEASE_KEY_ALIAS=lesailesdebride\nRELEASE_STORE_PASSWORD=LesAiles2024\nRELEASE_KEY_PASSWORD=LesAiles2024\n' >> android/gradle.properties
          echo "gradle.properties OK"

      - name: Patcher build.gradle pour la signature
        working-directory: artifacts/guardian-gabon
        run: node patch-signing.js
        env:
          GRADLE_FILE: android/app/build.gradle

      - name: Rendre Gradle exécutable
        working-directory: artifacts/guardian-gabon/android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ hashFiles('artifacts/guardian-gabon/android/**/*.gradle*') }}
          restore-keys: gradle-aab-

      - name: Build AAB signé
        working-directory: artifacts/guardian-gabon/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Vérifier AAB
        run: find artifacts/guardian-gabon/android/app/build/outputs/bundle -name "*.aab" -exec ls -lh {} \;

      - name: Publier GitHub Release avec le AAB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AAB_PATH="artifacts/guardian-gabon/android/app/build/outputs/bundle/release/app-release.aab"
          KEYSTORE_PATH="artifacts/guardian-gabon/android/app/release.keystore"
          TAG="playstore-v${{ github.run_number }}"

          gh release create "$TAG" \
            --title "Les Ailes de Bride — Play Store AAB v${{ github.run_number }}" \
            --notes "$(printf '## Fichiers a telecharger\n\n**app-release.aab** — a importer directement dans Google Play Console\n\n**release.keystore** — CONSERVEZ CE FICHIER PRECIEUSEMENT pour les mises a jour futures\n\n---\nBuild #${{ github.run_number }}')" \
            "$AAB_PATH#app-release.aab" \
            "$KEYSTORE_PATH#release.keystore"

          echo "✅ Release créée : https://github.com/${{ github.repository }}/releases/tag/$TAG"
