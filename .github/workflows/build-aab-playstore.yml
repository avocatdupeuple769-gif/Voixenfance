name: Build AAB Play Store

on:
  workflow_dispatch:

jobs:
  build-aab:
    name: AAB signé pour Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Résoudre package.json
        working-directory: artifacts/guardian-gabon
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const catalog = {'@tanstack/react-query':'^5.90.21','react':'19.1.0','react-dom':'19.1.0','zod':'^3.25.76'};
            function resolve(deps) {
              if (!deps) return deps;
              const out = {};
              for (const [k,v] of Object.entries(deps)) {
                if (k==='@workspace/api-client-react') continue;
                out[k]=v==='catalog:'?(catalog[k]||v):v;
              }
              return out;
            }
            pkg.devDependencies=resolve(pkg.devDependencies);
            pkg.dependencies=resolve(pkg.dependencies);
            fs.writeFileSync('package.json',JSON.stringify(pkg,null,2));
          "

      - name: Installer les dépendances
        working-directory: artifacts/guardian-gabon
        run: npm install --legacy-peer-deps

      - name: Symlink Metro
        run: ln -sf artifacts/guardian-gabon/node_modules node_modules

      - name: Variables d'environnement
        working-directory: artifacts/guardian-gabon
        run: |
          echo "EXPO_PUBLIC_FIREBASE_DB_URL=https://lesailesdebride-f3aca-default-rtdb.firebaseio.com" > .env
          echo "EXPO_PUBLIC_CLOUDINARY_CLOUD=dwwky8tnr" >> .env
          echo "EXPO_PUBLIC_CLOUDINARY_PRESET=afhxvsxc" >> .env
          cp .env .env.production

      - name: Expo Prebuild Android
        working-directory: artifacts/guardian-gabon
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Générer keystore de signature
        working-directory: artifacts/guardian-gabon
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias lesailesdebride \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Les Ailes de Bride,O=LesAilesDeBride,L=Libreville,C=GA" \
            -storepass LesAiles2024! \
            -keypass LesAiles2024!

      - name: Gradle chmod
        working-directory: artifacts/guardian-gabon/android
        run: chmod +x gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ hashFiles('artifacts/guardian-gabon/android/**/*.gradle*') }}
          restore-keys: gradle-aab-

      - name: Build AAB signé Play Store
        working-directory: artifacts/guardian-gabon/android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/artifacts/guardian-gabon/release.keystore \
            -Pandroid.injected.signing.store.password=LesAiles2024! \
            -Pandroid.injected.signing.key.alias=lesailesdebride \
            -Pandroid.injected.signing.key.password=LesAiles2024!
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Upload AAB Play Store
        uses: actions/upload-artifact@v4
        with:
          name: LesAilesDeBride-PlayStore-AAB
          path: artifacts/guardian-gabon/android/app/build/outputs/bundle/release/*.aab
          retention-days: 60

      - name: Upload Keystore IMPORTANT
        uses: actions/upload-artifact@v4
        with:
          name: LesAilesDeBride-Keystore-GARDEZ-CE-FICHIER
          path: artifacts/guardian-gabon/release.keystore
          retention-days: 60
